<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Virtual Wallet Exchange Demo</title>
    <style>
        :root {
            --bg-dark: #121214;
            --card-dark: #1c1c1e;
            --accent-color: #00caef;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --border-color: #2e2e33;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .wallet-container {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .balance-display {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-color);
            margin: 12px 0 4px 0;
        }

        .balance-label {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Generic geometric generic token placeholder instead of proprietary logos */
        .token-icon-placeholder {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #00caef, #b026ff);
            border-radius: 50%;
            display: inline-block;
        }

        .amount-input {
            width: 100%;
            background-color: #2c2c2e;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 14px 14px 42px;
            font-size: 16px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        .amount-input:focus {
            border-color: var(--accent-color);
        }

        /* Prevents users from adjusting via mouse scroll by accident */
        .amount-input::-webkit-inner-spin-button,
        .amount-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #00caef, #b026ff);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            background: #3a3a3c;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Server status feedback panel */
        .status-panel {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            line-height: 1.5;
        }

        .status-success {
            display: block;
            background-color: rgba(46, 204, 113, 0.1);
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }

        .status-error {
            display: block;
            background-color: rgba(231, 76, 60, 0.1);
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }

        .secure-badge {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="wallet-container">
    <div class="header">
        <div class="balance-label">Authoritative Wallet Balance</div>
        <div class="balance-display" id="currentBalance">25,500</div>
        <span style="font-size: 12px; color: var(--text-muted);">Available Virtual Tokens</span>
    </div>

    <!-- The form intercepts the standard submission to handle via secure JavaScript payload -->
    <form id="exchangeForm" onsubmit="handleSecureSend(event)">
        <div class="form-group">
            <label for="customAmount">Enter Custom Token Amount</label>
            <div class="input-wrapper">
                <span class="token-icon-placeholder"></span>
                <input 
                    type="number" 
                    id="customAmount" 
                    class="amount-input" 
                    placeholder="Min. 10 - Max. 50,000" 
                    required 
                    min="10" 
                    max="50000" 
                    step="1"
                >
            </div>
        </div>

        <button type="submit" id="sendBtn" class="submit-btn">Verify & Send Transaction</button>
    </form>

    <div id="statusReport" class="status-panel"></div>
    
    <div class="secure-badge">
        🔒 Cryptographic Signature Verification Active
    </div>
</div>

<script>
    // Mock user memory cache for training purposes
    let userBalance = 25500;

    function handleSecureSend(event) {
        // Prevent standard page reload behavior to process safely via simulation script
        event.preventDefault();
        
        const amountInput = document.getElementById('customAmount');
        const statusReport = document.getElementById('statusReport');
        const balanceDisplay = document.getElementById('currentBalance');
        const sendBtn = document.getElementById('sendBtn');
        
        // Parse numerical integrity safely
        const amountToSend = parseInt(amountInput.value, 10);

        // --- EXPLAINED ENGINEERING LOGIC ---
        // 1. Client-Side Guardrail Checklist:
        if (isNaN(amountToSend) || amountToSend < 10 || amountToSend > 50000) {
            showStatus("Failed: System limits rejected request range.", "error");
            return;
        }

        if (amountToSend > userBalance) {
            showStatus("Rejected: Insufficient token liquidity in source wallet.", "error");
            return;
        }

        // Simulate secure loading state while contacting backend ledger API
        sendBtn.disabled = true;
        sendBtn.innerText = "Verifying Ledger Signatures...";

        setTimeout(() => {
            // 2. Simulate Backend Verification Loop:
            // In production, the client must await a cryptographically verified receipt 
            // from the backend ledger database before changing any screen details.
            userBalance -= amountToSend;
            
            // Update client interface with verified data returned from the server
            balanceDisplay.innerText = userBalance.toLocaleString();
            
            showStatus(`✅ Transaction Verified!<br><strong>Amount Sent:</strong> ${amountToSend.toLocaleString()} Tokens<br><strong>Status:</strong> Ledger entry committed.`, "success");
            
            // Reset state inputs
            amountInput.value = '';
            sendBtn.disabled = false;
            sendBtn.innerText = "Verify & Send Transaction";
        }, 1200); // 1.2 second mock latency delay representing network roundtrip
    }

    function showStatus(message, type) {
        const panel = document.getElementById('statusReport');
        panel.innerHTML = message;
        panel.className = `status-panel status-${type}`;
    }
</script>

</body>
</html>
