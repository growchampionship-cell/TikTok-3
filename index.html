<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Custom Coin Exchange</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #7f7f7f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Bottom Sheet Container */
    .sheet-card {
      background: #ffffff;
      width: 360px;
      border-radius: 16px 16px 0 0;
      padding: 16px 20px 20px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    /* Modal Header */
    .sheet-header {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 20px;
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 600;
      color: #121212;
    }

    .close-btn {
      position: absolute;
      right: 0;
      background: none;
      border: none;
      font-size: 18px;
      color: #8a8a8e;
      cursor: pointer;
    }

    /* Dropdown Header */
    .dropdown-label {
      font-size: 12px;
      color: #8a8a8e;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }

    .dropdown-label::after {
      content: "▾";
      font-size: 10px;
    }

    /* Coin Input Display Area */
    .amount-display-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .coin-amount-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .coin-badge {
      width: 22px;
      height: 22px;
      background-color: #ffaa00;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 12px;
    }

    .coin-number {
      font-size: 22px;
      font-weight: 700;
      color: #121212;
    }

    .btn-all {
      background: none;
      border: none;
      color: #8a8a8e;
      font-size: 13px;
      cursor: pointer;
    }

    /* Conversion Rates Subtext */
    .conversion-rates {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #8a8a8e;
      margin-bottom: 16px;
      padding-bottom: 12px;
    }

    /* Custom Numeric Keypad Grid */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .key-btn {
      background-color: #f7f7f8;
      border: none;
      border-radius: 8px;
      height: 48px;
      font-size: 18px;
      font-weight: 500;
      color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .key-btn:active {
      background-color: #ececec;
    }

    /* Footer / Total Row */
    .total-summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .total-label {
      font-size: 14px;
      color: #121212;
    }

    .total-amount {
      font-size: 18px;
      font-weight: 700;
      color: #121212;
    }

    /* Action Submit Button */
    .btn-submit {
      width: 100%;
      background-color: #fe2c55;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px 0;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="sheet-card">
    <div class="sheet-header">
      <span class="sheet-title">Custom</span>
      <button class="close-btn">✕</button>
    </div>

    <div class="dropdown-label">Number of Coins</div>

    <div class="amount-display-row">
      <div class="coin-amount-group">
        <div class="coin-badge">d</div>
        <span class="coin-number">12,000,000</span>
      </div>
      <button class="btn-all">All</button>
    </div>

    <div class="conversion-rates">
      <span>€134400.00</span>
      <span>=</span>
      <span>$145200.00</span>
    </div>

    <div class="keypad-grid">
      <button class="key-btn">1</button>
      <button class="key-btn">2</button>
      <button class="key-btn">3</button>
      <button class="key-btn">4</button>
      <button class="key-btn">5</button>
      <button class="key-btn">6</button>
      <button class="key-btn">7</button>
      <button class="key-btn">8</button>
      <button class="key-btn">9</button>
      <button class="key-btn" style="color: #8a8a8e;">⌫</button>
      <button class="key-btn">000</button>
      <button class="key-btn">0</button>
    </div>

    <div class="total-summary-row">
      <span class="total-label">Total</span>
      <span class="total-amount">$145200.00</span>
    </div>

    <button class="btn-submit">Exchange</button>
  </div>

</body>
</html>
