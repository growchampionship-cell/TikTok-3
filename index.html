<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnings Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-title {
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 800;
            color: #000;
            margin: 5px 0;
        }

        .balance-subtext {
            color: #888;
            font-size: 12px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            background-color: #fafafa;
        }

        .input-wrapper span {
            color: #888;
            margin-right: 8px;
        }

        input[type="text"] {
            border: none;
            background: transparent;
            outline: none;
            font-size: 16px;
            width: 100%;
            color: #333;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-card {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-card:hover, .option-card.active {
            border-color: #fe2c55;
            background-color: #fff0f2;
        }

        .option-coins {
            font-weight: 700;
            color: #333;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }

        .option-value {
            color: #666;
            font-size: 12px;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background-color: #fe2c55;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-primary:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* Verification Modal */
        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 80%;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Balance Header -->
    <div class="header">
        <div class="balance-title">Available Balance</div>
        <div class="balance-amount">$1,254.35</div>
        <div class="balance-subtext">= 125,435 Coins</div>
    </div>

    <!-- Username Input -->
    <div class="input-group">
        <label>Account Username</label>
        <div class="input-wrapper">
            <span>@</span>
            <input type="text" id="username" placeholder="Enter username" oninput="checkInput()">
        </div>
    </div>

    <!-- Exchange Options -->
    <div class="input-group">
        <label>Exchange Amount</label>
        <div class="options-grid">
            <div class="option-card" onclick="selectOption(this)">
                <span class="option-coins">250</span>
                <span class="option-value">$3.03</span>
            </div>
            <div class="option-card" onclick="selectOption(this)">
                <span class="option-coins">500</span>
                <span class="option-value">$6.07</span>
            </div>
            <div class="option-card" onclick="selectOption(this)">
                <span class="option-coins">15,000</span>
                <span class="option-value">$182.04</span>
            </div>
        </div>
    </div>

    <!-- Action Button -->
    <button class="btn-primary" id="exchangeBtn" disabled onclick="showModal()">Exchange</button>
</div>

<!-- Verification Modal -->
<div class="modal" id="verificationModal">
    <div class="modal-content">
        <h3>Verification Required</h3>
        <p>To secure your account, we need to send a verification code to your registered email ending in <strong>••••42</strong>.</p>
        <button class="btn-primary" onclick="alert('Code sent! (This is a simulation)')" style="margin-top:10px;">Send Code</button>
        <button style="margin-top:10px; background:none; border:none; color:#888; text-decoration:underline; cursor:pointer;" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
    // Enable button when username is entered
    function checkInput() {
        const val = document.getElementById('username').value;
        const btn = document.getElementById('exchangeBtn');
        if (val.length > 0) {
            btn.disabled = false;
        } else {
            btn.disabled = true;
        }
    }

    // Highlight selected option
    function selectOption(element) {
        let cards = document.querySelectorAll('.option-card');
        cards.forEach(card => card.classList.remove('active'));
        element.classList.add('active');
    }

    // Show verification modal
    function showModal() {
        document.getElementById('verificationModal').style.display = 'flex';
    }

    // Close modal
    function closeModal() {
        document.getElementById('verificationModal').style.display = 'none';
    }
</script>

</body>
</html>
