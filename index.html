<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Exchange Confirmation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Card Wrapper */
    .popup-card {
      background: #ffffff;
      width: 360px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Success Circle Icon */
    .success-icon-wrapper {
      width: 56px;
      height: 56px;
      background-color: #25d366;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }

    .success-icon-wrapper svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Header Texts */
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #121212;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #757575;
      margin-bottom: 24px;
    }

    .coins-highlight {
      color: #121212;
      font-weight: 600;
    }

    /* Details Rows */
    .details-group {
      width: 100%;
      margin-bottom: 20px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      font-size: 14px;
    }

    .detail-label {
      color: #8a8a8e;
    }

    .detail-value {
      color: #121212;
      font-weight: 500;
    }

    /* Gifter Level Promotion Box */
    .promo-box {
      width: 100%;
      background-color: #f8f8f9;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tiktok-badge {
      width: 36px;
      height: 36px;
      background-color: #000000;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .tiktok-badge svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .promo-content {
      display: flex;
      flex-direction: column;
    }

    .promo-title {
      font-size: 13px;
      font-weight: 600;
      color: #121212;
      margin-bottom: 2px;
    }

    .promo-desc {
      font-size: 11px;
      color: #8a8a8e;
      line-height: 1.3;
    }

    /* Action Button */
    .btn-action {
      width: 100%;
      background-color: #25d366;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      padding: 14px 0;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-action:hover {
      background-color: #20bd5a;
    }
  </style>
</head>
<body>

  <div class="popup-card">
    <!-- Success Icon -->
    <div class="success-icon-wrapper">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <!-- Title Header -->
    <h2 class="title">Exchange Completed!</h2>
    <p class="subtitle">You exchanged for <span class="coins-highlight">🪙 15,000 Coins</span></p>

    <!-- Details Table -->
    <div class="details-group">
      <div class="detail-row">
        <span class="detail-label">Recipient</span>
        <span class="detail-value">@kaktuha</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Coins Exchanged</span>
        <span class="detail-value">15,000 Coins</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Deducted Amount</span>
        <span class="detail-value">$182.04</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Time</span>
        <span class="detail-value">9/4/2026, 8:11:34 AM</span>
      </div>
    </div>

    <!-- TikTok Gifter Level Box -->
    <div class="promo-box">
      <div class="tiktok-badge">
        <!-- SVG TikTok Logo -->
        <svg viewBox="0 0 448 512">
          <path d="M448 209.91a210.06 210.06 0 0 1-122.77-39.25V349.38A162.55 162.55 0 1 1 185 188.31V258.2a93.61 93.61 0 1 0 58.33 87.21V0h69.3a140.39 140.39 0 0 0 3.1 29.58 141.42 141.42 0 0 0 81.33 103.58 140.84 140.84 0 0 0 50.94 14.18z"/>
        </svg>
      </div>
      <div class="promo-content">
        <span class="promo-title">Start gifter level</span>
        <span class="promo-desc">Send your first Gift to begin your gifter journey and unlock more rewards as you level up</span>
      </div>
    </div>

    <!-- Back Button -->
    <button class="btn-action">← Go back</button>
  </div>

</body>
</html>
